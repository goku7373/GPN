<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPN Console</title>
    <!-- Theme bootstrap — runs before any CSS/JS to prevent FOUC -->
    <script>
      (function(){
        try {
          var k = 'gpn.theme', v = localStorage.getItem(k);
          if (v !== 'light' && v !== 'dark') {
            // First visit or no preference → default dark
            v = 'dark';
          }
          document.documentElement.setAttribute('data-theme', v);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
